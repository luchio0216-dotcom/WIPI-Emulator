name: Inotia real overwrite save test

on:
  push:
    branches: [feature/p-data-import]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-save-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Inotia package and private user WFS
        shell: bash
        env:
          INOTIA_USER_WFS_B64: ${{ secrets.INOTIA_USER_WFS_B64 }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/inotia android/app/src/androidTest/assets
          if [ -z "${INOTIA_USER_WFS_B64:-}" ]; then
            echo 'Missing GitHub Actions secret INOTIA_USER_WFS_B64' >&2
            exit 2
          fi
          printf '%s' "$INOTIA_USER_WFS_B64" | base64 --decode > android/app/src/androidTest/assets/inotia_user_slot1.wfs
          python3 - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path('android/app/src/androidTest/assets/inotia_user_slot1.wfs')
          b=p.read_bytes()
          assert len(b)==703, len(b)
          assert hashlib.sha256(b).hexdigest()=='32f4404f36930317a8a102b079e6da105fc8628837e53a7606dbf8a9b81ec918'
          assert b[:8]==b'WFSAVEBK'
          print('Private WFS fixture verified:', len(b), 'bytes')
          PY
          unset INOTIA_USER_WFS_B64

          curl -fsSL -A 'Mozilla/5.0' 'https://dubigame.tistory.com/135' -o /tmp/inotia/page.html
          python3 - <<'PY'
          import html,re,subprocess,pathlib,zipfile
          page=pathlib.Path('/tmp/inotia/page.html').read_text(errors='ignore')
          urls=[]
          for raw in re.findall(r'href=["\']([^"\']+)["\']',page,flags=re.I):
              u=html.unescape(raw)
              if 'blog.kakaocdn.net' in u and ('.zip' in u.lower() or 'tfile.zip' in u.lower()): urls.append(u)
          if not urls: raise SystemExit('Inotia ZIP URL not found')
          subprocess.run(['curl','-fL','--retry','3','-A','Mozilla/5.0','-e','https://dubigame.tistory.com/135',urls[0],'-o','/tmp/inotia/original.zip'],check=True)
          src=zipfile.ZipFile('/tmp/inotia/original.zip')
          names=[n.replace('\\','/') for n in src.namelist()]
          adf=next((n for n in names if n=='__adf__' or n.endswith('/__adf__')),None)
          if not adf: raise SystemExit('__adf__ missing')
          prefix=adf[:-len('__adf__')]
          with zipfile.ZipFile('android/app/src/androidTest/assets/inotia1_flat.zip','w',zipfile.ZIP_DEFLATED) as out:
              for info in src.infolist():
                  n=info.filename.replace('\\','/')
                  if info.is_dir() or not n.startswith(prefix): continue
                  rel=n[len(prefix):]
                  if rel: out.writestr(rel,src.read(info))
          PY

      - name: Build patched x86_64 JNI
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          rustup target add x86_64-linux-android
          TOOLCHAIN="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/x86_64-linux-android26-clang"
          export CC_x86_64_linux_android="$TOOLCHAIN/bin/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CFLAGS_x86_64_linux_android="-D__ANDROID_API__=26"
          cd rust; cargo fetch; cd ..
          python3 scripts/patch-inotia-min.py
          python3 scripts/patch-inotia-storage-probe.py
          python3 scripts/patch-inotia-save-overwrite.py
          cd rust; cargo build -p wipi_android --release --target x86_64-linux-android; cd ..
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp rust/target/x86_64-linux-android/release/libwipi_android.so android/app/src/main/jniLibs/x86_64/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Import real WFS, overwrite SLOT 1, force-stop live process, relaunch and reload
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            APP_APK="$(find "$PWD/android/app/build/outputs/apk" -type f -name '*.apk' ! -path '*/androidTest/*' -print -quit)"
            TEST_APK="$(find "$PWD/android/app/build/outputs/apk" -type f -name '*.apk' -path '*/androidTest/*' -print -quit)"
            test -f "$APP_APK"
            test -f "$TEST_APK"
            adb install -r "$APP_APK"
            adb install -r "$TEST_APK"

            PKG='com.parkjeongseop.wipi.pdata4'
            RUNNER='com.parkjeongseop.wipi.pdata4.test/androidx.test.runner.AndroidJUnitRunner'
            CLASS='com.parkjeongseop.wipi.InotiaUserWfsSlot1PersistenceTest'
            mkdir -p inotia-save-result
            adb shell pm clear "$PKG" >/dev/null
            adb logcat -c || true

            # Phase 1 deliberately stays alive after a verified real SLOT 1 overwrite.
            adb shell am instrument -w -r -e class "$CLASS#importAndOverwriteSlot1ThenWaitForForceStop" "$RUNNER" > /tmp/phase1.txt 2>&1 &
            PHASE1_HOST_PID=$!
            READY=0
            for i in $(seq 1 180); do
              if adb exec-out run-as "$PKG" cat files/inotia-force-stop-ready.flag > /tmp/committed-sha.txt 2>/dev/null; then
                READY=1
                break
              fi
              if ! kill -0 "$PHASE1_HOST_PID" 2>/dev/null; then
                echo 'Phase 1 instrumentation exited before force-stop readiness' >&2
                cat /tmp/phase1.txt || true
                exit 1
              fi
              sleep 2
            done
            if [ "$READY" -ne 1 ]; then
              echo 'Timed out waiting for verified SLOT 1 overwrite' >&2
              cat /tmp/phase1.txt || true
              exit 1
            fi

            adb exec-out run-as "$PKG" cat files/inotia-user-slot1-phase1.txt > inotia-save-result/phase1-report.txt
            for f in user-wfs-imported-slot1-gameplay.png user-wfs-overwrite-result.png; do
              adb exec-out run-as "$PKG" cat "cache/$f" > "inotia-save-result/$f" 2>/dev/null || true
            done

            PID_BEFORE="$(adb shell pidof "$PKG" | tr -d '\r')"
            if [ -z "$PID_BEFORE" ]; then
              echo 'Target process was not alive before force-stop' >&2
              exit 1
            fi
            echo "pidBeforeForceStop=$PID_BEFORE" | tee inotia-save-result/force-stop.txt
            echo "committedSha256=$(cat /tmp/committed-sha.txt | tr -d '\r\n')" >> inotia-save-result/force-stop.txt

            adb shell am force-stop "$PKG"
            PID_GONE=0
            for i in $(seq 1 30); do
              if [ -z "$(adb shell pidof "$PKG" | tr -d '\r')" ]; then
                PID_GONE=1
                break
              fi
              sleep 1
            done
            if [ "$PID_GONE" -ne 1 ]; then
              echo 'Target PID survived force-stop' >&2
              exit 1
            fi
            echo 'pidAfterForceStop=none' >> inotia-save-result/force-stop.txt
            wait "$PHASE1_HOST_PID" || true
            cp /tmp/phase1.txt inotia-save-result/phase1-instrumentation.txt || true

            # Phase 2 is a new process. It must reload the already-overwritten SLOT 1 without importing again.
            set +e
            adb shell am instrument -w -r -e class "$CLASS#reloadPersistedSlotAfterForceStop" "$RUNNER" > /tmp/phase2.txt 2>&1
            PHASE2_RC=$?
            set -e
            cat /tmp/phase2.txt
            cp /tmp/phase2.txt inotia-save-result/phase2-instrumentation.txt
            adb exec-out run-as "$PKG" cat cache/user-wfs-reloaded-slot1-gameplay.png > inotia-save-result/user-wfs-reloaded-slot1-gameplay.png 2>/dev/null || true
            adb exec-out run-as "$PKG" cat cache/user-wfs-final-report.txt > inotia-save-result/final-report.txt 2>/dev/null || true
            adb logcat -d > inotia-save-result/logcat.txt 2>/dev/null || true

            if [ "$PHASE2_RC" -ne 0 ]; then exit 1; fi
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_STATUS_CODE: -2|INSTRUMENTATION_CODE: -1' /tmp/phase2.txt; then exit 1; fi
            if ! grep -Eq 'OK \(1 test' /tmp/phase2.txt; then exit 1; fi
            if ! grep -q 'forceStopPersistence=true' inotia-save-result/final-report.txt; then exit 1; fi
            if ! grep -q 'slot1ReloadSucceeded=true' inotia-save-result/final-report.txt; then exit 1; fi
            if ! grep -q 'overwriteSucceeded=true' inotia-save-result/phase1-report.txt; then exit 1; fi

      - name: Upload save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inotia-real-save-result
          path: inotia-save-result/
          if-no-files-found: warn
          retention-days: 14
