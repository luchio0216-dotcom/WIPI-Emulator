name: Inotia real overwrite save test

on:
  push:
    branches: [feature/p-data-import]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-save-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Inotia package and user WFS fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/inotia android/app/src/androidTest/assets
          test -f android/app/src/androidTest/assets/inotia_user_slot1.wfs
          python3 - <<'PY'
          import pathlib, hashlib
          p=pathlib.Path('android/app/src/androidTest/assets/inotia_user_slot1.wfs')
          b=p.read_bytes()
          assert len(b)==703, len(b)
          assert hashlib.sha256(b).hexdigest()=='32f4404f36930317a8a102b079e6da105fc8628837e53a7606dbf8a9b81ec918'
          assert b[:8]==b'WFSAVEBK'
          print('WFS fixture OK', len(b), hashlib.sha256(b).hexdigest())
          PY
          curl -fsSL -A 'Mozilla/5.0' 'https://dubigame.tistory.com/135' -o /tmp/inotia/page.html
          python3 - <<'PY'
          import html,re,subprocess,pathlib,zipfile
          page=pathlib.Path('/tmp/inotia/page.html').read_text(errors='ignore')
          urls=[]
          for raw in re.findall(r'href=["\']([^"\']+)["\']',page,flags=re.I):
              u=html.unescape(raw)
              if 'blog.kakaocdn.net' in u and ('.zip' in u.lower() or 'tfile.zip' in u.lower()): urls.append(u)
          if not urls: raise SystemExit('Inotia ZIP URL not found')
          subprocess.run(['curl','-fL','--retry','3','-A','Mozilla/5.0','-e','https://dubigame.tistory.com/135',urls[0],'-o','/tmp/inotia/original.zip'],check=True)
          src=zipfile.ZipFile('/tmp/inotia/original.zip')
          names=[n.replace('\\','/') for n in src.namelist()]
          adf=next((n for n in names if n=='__adf__' or n.endswith('/__adf__')),None)
          if not adf: raise SystemExit('__adf__ missing')
          prefix=adf[:-len('__adf__')]
          with zipfile.ZipFile('android/app/src/androidTest/assets/inotia1_flat.zip','w',zipfile.ZIP_DEFLATED) as out:
              for info in src.infolist():
                  n=info.filename.replace('\\','/')
                  if info.is_dir() or not n.startswith(prefix): continue
                  rel=n[len(prefix):]
                  if rel: out.writestr(rel,src.read(info))
          PY

      - name: Build patched x86_64 JNI
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          rustup target add x86_64-linux-android
          TOOLCHAIN="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/x86_64-linux-android26-clang"
          export CC_x86_64_linux_android="$TOOLCHAIN/bin/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CFLAGS_x86_64_linux_android="-D__ANDROID_API__=26"
          cd rust; cargo fetch; cd ..
          python3 scripts/patch-inotia-min.py
          python3 scripts/patch-inotia-storage-probe.py
          python3 scripts/patch-inotia-save-overwrite.py
          cd rust; cargo build -p wipi_android --release --target x86_64-linux-android; cd ..
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp rust/target/x86_64-linux-android/release/libwipi_android.so android/app/src/main/jniLibs/x86_64/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Import user WFS, overwrite slot 1, force-stop, relaunch and reload
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            APP_APK="$(find "$PWD/android/app/build/outputs/apk" -type f -name '*.apk' ! -path '*/androidTest/*' -print -quit)"
            TEST_APK="$(find "$PWD/android/app/build/outputs/apk" -type f -name '*.apk' -path '*/androidTest/*' -print -quit)"
            echo "APP_APK=$APP_APK"
            echo "TEST_APK=$TEST_APK"
            test -f "$APP_APK"
            test -f "$TEST_APK"
            adb install -r "$APP_APK"
            adb install -r "$TEST_APK"
            adb logcat -c || true

            run_test() {
              method="$1"
              output="$2"
              set +e
              adb shell am instrument -w -r \
                -e class "com.parkjeongseop.wipi.InotiaSaveOverwriteExploreTest#$method" \
                com.parkjeongseop.wipi.pdata4.test/androidx.test.runner.AndroidJUnitRunner \
                > "$output" 2>&1
              rc=$?
              set -e
              cat "$output"
              if [ "$rc" -ne 0 ]; then
                echo "Instrumentation command failed with rc=$rc"
                return 1
              fi
              if grep -Eq 'FAILURES!!!|INSTRUMENTATION_STATUS_CODE: -2' "$output"; then
                echo "Instrumentation reported a test failure"
                return 1
              fi
              if ! grep -Eq 'OK \([0-9]+ test' "$output"; then
                echo "Instrumentation did not report an OK test result"
                return 1
              fi
            }

            mkdir -p inotia-save-result
            run_test phase1ImportUserWfsLoadSlot1AndOverwrite /tmp/wfs-phase1.txt
            cp /tmp/wfs-phase1.txt inotia-save-result/instrumentation-phase1.txt

            echo 'Force-stopping target app to prove process-level persistence'
            adb shell am force-stop com.parkjeongseop.wipi.pdata4
            sleep 2
            TARGET_PID="$(adb shell pidof com.parkjeongseop.wipi.pdata4 2>/dev/null | tr -d '\r' || true)"
            echo "pidAfterForceStop=${TARGET_PID:-none}"
            test -z "$TARGET_PID"

            run_test phase2RelaunchAndLoadPersistedSlot1 /tmp/wfs-phase2.txt
            cp /tmp/wfs-phase2.txt inotia-save-result/instrumentation-phase2.txt

            for f in \
              inotia-wfs-loaded-slot1.png \
              inotia-wfs-menu.png \
              inotia-wfs-system-tab.png \
              inotia-wfs-system-list.png \
              inotia-wfs-save-result.png \
              inotia-wfs-relaunched-slot1.png \
              inotia-wfs-phase1.txt \
              inotia-wfs-phase2.txt; do
              adb exec-out run-as com.parkjeongseop.wipi.pdata4 cat "cache/$f" > "inotia-save-result/$f" 2>/dev/null || true
            done
            adb logcat -d > inotia-save-result/logcat.txt 2>/dev/null || true
            ls -lh inotia-save-result

      - name: Upload save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inotia-real-save-result
          path: inotia-save-result/
          if-no-files-found: warn
          retention-days: 14
