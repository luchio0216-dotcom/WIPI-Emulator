name: Inotia4 APK install and launch test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inotia4-apk-test.yml'
      - 'inotia4-ci/**'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: inotia4-apk-ci-exact-source-v1
  cancel-in-progress: true

jobs:
  android-launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '/dev/kvm is not available on this runner'
            exit 1
          fi

      - name: Verify patched resource fixture
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d inotia4-ci/patches/memorytext_e.dat.jpg.b64 > "$RUNNER_TEMP/memorytext_e.dat.jpg"
          test "$(sha256sum "$RUNNER_TEMP/memorytext_e.dat.jpg" | awk '{print $1}')" = "75bb655c8c2cd3e89a28e8b90e1e6d1d7900f26521dc5aece8572964079cb3ee"

      - name: Run exact-source control and patched runtime diagnostics
        id: emulator-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash inotia4-ci/run_all_cases.sh

      - name: Upload diagnostic logs, screenshots, and candidate APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inotia4-apk-diagnostics-${{ github.run_number }}
          path: inotia4-ci/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Record validation result without email-spam failures
        if: always()
        shell: bash
        run: |
          set -u
          STATUS=inotia4-ci/test-results/status.txt
          RESULT=inotia4-ci/test-results/validation.txt
          echo 'VALIDATION=NOT_READY' > "$RESULT"

          if [[ ! -f "$STATUS" ]]; then
            echo 'reason=no_status_file' >> "$RESULT"
            echo '::warning::No status file was produced; diagnostic did not reach validation.'
            exit 0
          fi

          cat "$STATUS"
          CONTROL_RC="$(awk -F= '$1=="resigned-control"{print $2}' "$STATUS")"
          PATCHED_RC="$(awk -F= '$1=="patched-999"{print $2}' "$STATUS")"
          echo "control_rc=$CONTROL_RC" >> "$RESULT"
          echo "patched_rc=$PATCHED_RC" >> "$RESULT"

          PASS=1
          [[ "$CONTROL_RC" == "0" ]] || PASS=0
          [[ "$PATCHED_RC" == "0" ]] || PASS=0
          grep -q '^RESULT=resigned-control FOREGROUND_60S_OK$' inotia4-ci/test-results/resigned-control/summary.txt 2>/dev/null || PASS=0
          grep -q '^RESULT=patched-999 FOREGROUND_60S_OK$' inotia4-ci/test-results/patched-999/summary.txt 2>/dev/null || PASS=0
          grep -q '^resource_fixture_match=yes$' inotia4-ci/test-results/patched-999/resource-hashes.txt 2>/dev/null || PASS=0
          grep -q '^installed_patch_sha256=75bb655c8c2cd3e89a28e8b90e1e6d1d7900f26521dc5aece8572964079cb3ee$' inotia4-ci/test-results/patched-999/resource-hashes.txt 2>/dev/null || PASS=0
          grep -q '^exact_source_md5=650cf86aac816e651a56c8642b03afa7$' inotia4-ci/test-results/patched-999/source-fingerprint.txt 2>/dev/null || PASS=0
          test -s inotia4-ci/test-results/patched-999/tested-apks/Inotia4_Berserker_Buffs_999s_arm64_candidate.apk || PASS=0

          if [[ "$PASS" == "1" ]]; then
            echo 'VALIDATION=PASS' > "$RESULT"
            echo 'exact_source_match=yes' >> "$RESULT"
            echo 'control_foreground_60s=yes' >> "$RESULT"
            echo 'patched_foreground_60s=yes' >> "$RESULT"
            echo 'candidate_arm64_built=yes' >> "$RESULT"
            echo 'Exact-source runtime surrogate validation PASSED.'
          else
            echo '::warning::Validation not ready yet. See status, summaries, screenshots and logs in the artifact.'
          fi

          cat "$RESULT"
          exit 0
