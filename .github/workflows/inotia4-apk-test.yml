name: Inotia4 APK install and launch test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inotia4-apk-test.yml'
      - 'inotia4-ci/**'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: inotia4-apk-ci
  cancel-in-progress: true

jobs:
  android-launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '/dev/kvm is not available on this runner'
          fi

      - name: Verify patched resource fixture
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d inotia4-ci/patches/memorytext_e.dat.jpg.b64 > "$RUNNER_TEMP/memorytext_e.dat.jpg"
          sha256sum "$RUNNER_TEMP/memorytext_e.dat.jpg"
          test "$(sha256sum "$RUNNER_TEMP/memorytext_e.dat.jpg" | awk '{print $1}')" = "75bb655c8c2cd3e89a28e8b90e1e6d1d7900f26521dc5aece8572964079cb3ee"

      - name: Run original, re-signed control, and patched diagnostic cases
        id: emulator-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash inotia4-ci/run_all_cases.sh

      - name: Upload diagnostic logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inotia4-apk-diagnostics-${{ github.run_number }}
          path: inotia4-ci/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Evaluate launch results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS=inotia4-ci/test-results/status.txt
          if [[ ! -f "$STATUS" ]]; then
            echo "No status file was produced; emulator/bootstrap stage failed."
            exit 1
          fi
          cat "$STATUS"
          OFFICIAL_RC="$(awk -F= '$1=="official-original"{print $2}' "$STATUS")"
          RESIGNED_RC="$(awk -F= '$1=="resigned-control"{print $2}' "$STATUS")"
          PATCHED_RC="$(awk -F= '$1=="patched-999"{print $2}' "$STATUS")"

          echo "official-original rc=$OFFICIAL_RC"
          echo "resigned-control rc=$RESIGNED_RC"
          echo "patched-999 rc=$PATCHED_RC"

          if [[ "$OFFICIAL_RC" != "0" || "$RESIGNED_RC" != "0" || "$PATCHED_RC" != "0" ]]; then
            exit 1
          fi
