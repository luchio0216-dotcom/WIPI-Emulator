name: Inotia2 startup test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p-data-import
    paths:
      - 'android/app/src/androidTest/java/com/parkjeongseop/wipi/Inotia2StartupTest.kt'
      - 'android/app/src/main/java/com/parkjeongseop/wipi/GameLibrary.kt'
      - 'android/app/src/main/java/com/parkjeongseop/wipi/PDataImporter.kt'
      - 'scripts/patch-inotia2-certificate.py'
      - 'scripts/patch-ktf-packaged-db-seed.py'
      - 'scripts/patch-inotia2-ktf-slot12.py'
      - '.github/workflows/inotia2-startup-test.yml'

jobs:
  inotia2-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INOTIA2_SHA256: 974e0df9ab1e51751efdef21a0fe324ad79917f41cd049fcfaf7c46c14f9e324
      INOTIA2_URL: https://blog.kakaocdn.net/dn/bKKLup/btrI1E3JgJQ/sdJOAJEjZqkFlQxYP0VvN1/%EC%9D%B4%EB%85%B8%ED%8B%B0%EC%95%84%EC%97%B0%EB%8C%80%EA%B8%B02.zip?attach=1&knm=tfile.zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install Android components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Download exact Inotia2 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/androidTest/assets
          curl -fL --retry 3 --retry-delay 2 "$INOTIA2_URL" -o android/app/src/androidTest/assets/inotia2-original.zip
          ACTUAL="$(sha256sum android/app/src/androidTest/assets/inotia2-original.zip | awk '{print $1}')"
          echo "Inotia2 SHA-256: $ACTUAL"
          test "$ACTUAL" = "$INOTIA2_SHA256"

      - name: Build x86_64 Rust JNI with Inotia2 compatibility
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/x86_64-linux-android26-clang"
          export CC_x86_64_linux_android="$TOOLCHAIN/bin/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CFLAGS_x86_64_linux_android="-D__ANDROID_API__=26"
          cd rust
          cargo fetch
          cd ..
          python3 scripts/patch-inotia-min.py
          python3 scripts/patch-inotia2-certificate.py
          python3 scripts/patch-ktf-packaged-db-seed.py
          python3 scripts/patch-inotia2-ktf-slot12.py
          cd rust
          cargo build -p wipi_android --release --target x86_64-linux-android
          cd ..
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp rust/target/x86_64-linux-android/release/libwipi_android.so android/app/src/main/jniLibs/x86_64/

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm

      - name: Run Inotia2 startup instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd android
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.parkjeongseop.wipi.Inotia2StartupTest --stacktrace

      - name: Collect Inotia2 diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p inotia2-startup-result
          find android/app/build -type f \( -name 'inotia2-frame-*.png' -o -name 'inotia2-report.txt' -o -name '*.xml' \) -print -exec cp {} inotia2-startup-result/ \; || true
          adb logcat -d > inotia2-startup-result/logcat.txt 2>/dev/null || true

      - name: Upload Inotia2 startup result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inotia2-startup-result
          path: inotia2-startup-result/
          if-no-files-found: warn
