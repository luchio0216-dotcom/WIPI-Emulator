name: Inotia 2 original startup test

on:
  push:
    branches:
      - feature/p-data-import
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inotia2-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch exact original Inotia 2 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/inotia2 android/app/src/androidTest/assets
          curl -fsSL -A 'Mozilla/5.0' 'https://dubigame.tistory.com/136' -o /tmp/inotia2/page.html
          python3 - <<'PY'
          import html, re, subprocess, pathlib, hashlib
          page = pathlib.Path('/tmp/inotia2/page.html').read_text(errors='ignore')
          candidates = re.findall(r'href=["\']([^"\']+)["\']', page, flags=re.I)
          urls = []
          for raw in candidates:
              u = html.unescape(raw).replace('\\u0026', '&').replace('\\/', '/')
              if 'blog.kakaocdn.net' in u and ('.zip' in u.lower() or 'tfile.zip' in u.lower()):
                  urls.append(u)
          if not urls:
              for raw in re.findall(r'https?://[^"\'<> ]*blog\.kakaocdn\.net[^"\'<> ]+', page, flags=re.I):
                  u = html.unescape(raw).replace('\\u0026', '&').replace('\\/', '/')
                  if '.zip' in u.lower() or 'tfile.zip' in u.lower():
                      urls.append(u)
          if not urls:
              raise SystemExit('Could not locate Inotia 2 ZIP attachment')
          expected = '974e0df9ab1e51751efdef21a0fe324ad79917f41cd049fcfaf7c46c14f9e324'
          target = pathlib.Path('/tmp/inotia2/original.zip')
          matched = False
          for url in dict.fromkeys(urls):
              try:
                  subprocess.run(['curl','-fL','--retry','3','-A','Mozilla/5.0','-e','https://dubigame.tistory.com/136',url,'-o',str(target)], check=True)
              except subprocess.CalledProcessError:
                  continue
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              print('candidate sha256', digest, 'bytes', target.stat().st_size)
              if digest == expected:
                  matched = True
                  break
          if not matched:
              raise SystemExit('Downloaded attachments did not match exact Inotia 2 SHA-256')
          out = pathlib.Path('android/app/src/androidTest/assets/inotia2_original.zip')
          out.write_bytes(target.read_bytes())
          print('exact Inotia 2 fixture:', out, out.stat().st_size, expected)
          PY

      - name: Install Android NDK and Rust x86_64 target
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          rustup target add x86_64-linux-android

      - name: Build x86_64 Rust JNI with Inotia compatibility
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/x86_64-linux-android26-clang"
          export CC_x86_64_linux_android="$TOOLCHAIN/bin/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CFLAGS_x86_64_linux_android="-D__ANDROID_API__=26"
          cd rust
          cargo fetch
          cd ..
          python3 scripts/patch-inotia-min.py
          python3 scripts/patch-inotia2-certificate.py
          python3 scripts/patch-inotia-storage-probe.py
          python3 scripts/patch-inotia-save-overwrite.py
          cd rust
          cargo build -p wipi_android --release --target x86_64-linux-android
          cd ..
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp rust/target/x86_64-linux-android/release/libwipi_android.so android/app/src/main/jniLibs/x86_64/

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run exact Inotia 2 in Android virtual device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            APP_APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
            TEST_APK=$(find android/app/build/outputs/apk/androidTest/debug -name '*.apk' | head -n1)
            adb install -r "$APP_APK"
            adb install -r "$TEST_APK"
            set +e
            adb shell am instrument -w -r -e class com.parkjeongseop.wipi.Inotia2StartupTest com.parkjeongseop.wipi.pdata4.test/androidx.test.runner.AndroidJUnitRunner > /tmp/inotia2-instrumentation.txt 2>&1
            TEST_RC=$?
            if grep -qE 'FAILURES!!!|No Inotia 2 emulator frame was produced|Inotia 2 never opened/provisioned cert.c2s' /tmp/inotia2-instrumentation.txt; then TEST_RC=1; fi
            if grep -qE 'OK \([0-9]+ tests?\)' /tmp/inotia2-instrumentation.txt; then TEST_RC=0; fi
            cat /tmp/inotia2-instrumentation.txt
            set -e
            mkdir -p inotia2-startup-result
            PKG='com.parkjeongseop.wipi.pdata4'
            for f in inotia2-frame-0.png inotia2-frame-1.png inotia2-frame-2.png inotia2-frame-3.png inotia2-frame-4.png inotia2-frame-5.png inotia2-report.txt; do
              adb exec-out run-as "$PKG" cat "cache/$f" > "inotia2-startup-result/$f" 2>/dev/null || true
            done
            cp /tmp/inotia2-instrumentation.txt inotia2-startup-result/instrumentation.txt || true
            adb logcat -d > inotia2-startup-result/logcat.txt 2>/dev/null || true
            ls -lh inotia2-startup-result || true
            exit "$TEST_RC"

      - name: Upload Inotia 2 startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inotia2-startup-result
          path: inotia2-startup-result/
          if-no-files-found: warn
          retention-days: 14
