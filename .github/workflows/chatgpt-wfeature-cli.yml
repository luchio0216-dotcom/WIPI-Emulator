name: ChatGPT W-Feature CLI build

on:
  push:
    branches:
      - chatgpt/inotia2-cheat-lab
    paths:
      - '.github/workflows/chatgpt-wfeature-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wfeature-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout host repository
        uses: actions/checkout@v4

      - name: Checkout W-Feature v0.5.0
        uses: actions/checkout@v4
        with:
          repository: movingwoo/wfeature
          ref: v0.5.0
          path: wfeature-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: wfeature-src/go.sum

      - name: Build live-analysis binaries
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('wfeature-src/internal/serve/serve.go')
          s = p.read_text()
          old = '\tPath string `json:"path,omitempty"`\n'
          new = old + '\t// Line is one text cheat-console command for the analysis-only serve bridge.\n\tLine string `json:"line,omitempty"`\n'
          if old not in s:
              raise SystemExit('Request path marker not found')
          s = s.replace(old, new, 1)
          old = '\tPath   string        `json:"path,omitempty"`\n'
          new = old + '\tText   string        `json:"text,omitempty"`\n'
          if old not in s:
              raise SystemExit('Response path marker not found')
          s = s.replace(old, new, 1)
          old = '\tDefaultHold int\n'
          new = old + '\t// Cheat executes one command on the same cheat console used by -cheat.\n\tCheat func(line string) string\n'
          if old not in s:
              raise SystemExit('Driver hold marker not found')
          s = s.replace(old, new, 1)
          old = '\tcase "route":\n\t\treturn state.route(ctx, request)\n'
          new = old + '''\tcase "cheat":\n\t\tif state.driver.Cheat == nil {\n\t\t\treturn failure("cheat is not available on this platform")\n\t\t}\n\t\tline := strings.TrimSpace(request.Line)\n\t\tif line == "" {\n\t\t\treturn failure("cheat needs a non-empty `line`")\n\t\t}\n\t\treturn Response{OK: true, Text: state.driver.Cheat(line)}\n'''
          if old not in s:
              raise SystemExit('route switch marker not found')
          s = s.replace(old, new, 1)
          s = s.replace('step, key, touch, park, screen, pixel, diag, shot, route and quit', 'step, key, touch, park, screen, pixel, diag, shot, route, cheat and quit', 1)
          p.write_text(s)

          p = Path('wfeature-src/cmd/cli/main.go')
          s = p.read_text()
          anchor = 'session, err := ktf.StartSession(ctx, data, options)'
          before, sep, after = s.partition(anchor)
          if not sep:
              raise SystemExit('current KTF session anchor not found')
          old = '\tif serveSession {\n\t\tdriver := &serve.Driver{\n'
          new = '\tif serveSession {\n\t\tkeyCheatTable(session.CheatConsole(), path)\n\t\tdriver := &serve.Driver{\n'
          if old not in after:
              raise SystemExit('current KTF serve driver marker not found')
          after = after.replace(old, new, 1)
          old = '\t\t\tDefaultHold: keyHold,\n\t\t}\n'
          new = '\t\t\tDefaultHold: keyHold,\n\t\t\tCheat:       session.CheatConsole().Execute,\n\t\t}\n'
          if old not in after:
              raise SystemExit('current KTF DefaultHold marker not found')
          after = after.replace(old, new, 1)
          p.write_text(before + sep + after)
          PY
          grep -n 'case "cheat"' wfeature-src/internal/serve/serve.go
          grep -n 'Cheat:.*CheatConsole' wfeature-src/cmd/cli/main.go
          cd wfeature-src
          make release
          make server-release
          install -Dm755 build/release/wfeature ../out/wfeature-cheatserve
          install -Dm755 build/release/wfeature-server ../out/wfeature-server
          sha256sum ../out/wfeature-cheatserve ../out/wfeature-server | tee ../out/SHA256SUMS

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wfeature-inotia2-live-tools
          path: out/
          if-no-files-found: error
          retention-days: 7
