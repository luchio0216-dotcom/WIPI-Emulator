name: ChatGPT W-Feature CLI build

on:
  push:
    branches:
      - chatgpt/inotia2-cheat-lab
    paths:
      - '.github/workflows/chatgpt-wfeature-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wfeature-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout host repository
        uses: actions/checkout@v4

      - name: Checkout W-Feature v0.5.0
        uses: actions/checkout@v4
        with:
          repository: movingwoo/wfeature
          ref: v0.5.0
          path: wfeature-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: wfeature-src/go.sum

      - name: Instrument KTF Host service windows
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('wfeature-src/internal/platform/ktf/session.go')
          s = p.read_text()
          old = 'sessionDefaultMaxSteps   = 100_000_000'
          new = 'sessionDefaultMaxSteps   = 10_000_000'
          if old not in s:
              raise SystemExit('session step marker not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('wfeature-src/internal/platform/ktf/service_budget.go')
          s = p.read_text()
          s = s.replace('"fmt"\n\t"time"', '"fmt"\n\t"os"\n\t"time"', 1)
          needle = '\tnow := client.now()\n'
          insert = '''\tnow := client.now()\n\tif client.thread != nil {\n\t\tctx := client.thread.Context()\n\t\tfmt.Fprintf(os.Stderr, "WFEATURE_SERVICE_WINDOW steps=%d remaining=%d pc=%#08x lr=%#08x clock_reads=%d\\n", client.core.Steps(), client.serviceRemaining, ctx.Registers[15], ctx.Registers[14], client.guestClockReads)\n\t}\n'''
          if needle not in s:
              raise SystemExit('continueHostService marker not found')
          p.write_text(s.replace(needle, insert, 1))
          PY
          grep -n 'sessionDefaultMaxSteps' wfeature-src/internal/platform/ktf/session.go | head
          grep -n 'WFEATURE_SERVICE_WINDOW' wfeature-src/internal/platform/ktf/service_budget.go
          cd wfeature-src
          make release
          install -Dm755 build/release/wfeature ../out/wfeature-probe
          sha256sum ../out/wfeature-probe | tee ../out/SHA256SUMS

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wfeature-inotia2-probe
          path: out/
          if-no-files-found: error
          retention-days: 7
