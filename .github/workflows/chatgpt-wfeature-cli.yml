name: ChatGPT W-Feature CLI build

on:
  push:
    branches:
      - chatgpt/inotia2-cheat-lab
    paths:
      - '.github/workflows/chatgpt-wfeature-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wfeature-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout host repository
        uses: actions/checkout@v4

      - name: Checkout W-Feature v0.5.0
        uses: actions/checkout@v4
        with:
          repository: movingwoo/wfeature
          ref: v0.5.0
          path: wfeature-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: wfeature-src/go.sum

      - name: Build analysis-speed KTF runtime
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wfeature-src/internal/backend/speed.go')
          s = p.read_text()
          s = s.replace('SpeedCeiling = 16.0', 'SpeedCeiling = 256.0', 1)
          p.write_text(s)

          p = Path('wfeature-src/internal/platform/ktf/service_budget.go')
          s = p.read_text()
          old = 'const batchGuestStepsPerMillisecond = 100_000'
          new = 'const batchGuestStepsPerMillisecond = 1_000'
          if old not in s:
              raise SystemExit('batch clock marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n 'SpeedCeiling' wfeature-src/internal/backend/speed.go
          grep -n 'batchGuestStepsPerMillisecond' wfeature-src/internal/platform/ktf/service_budget.go
          cd wfeature-src
          make release
          install -Dm755 build/release/wfeature ../out/wfeature-lab
          sha256sum ../out/wfeature-lab | tee ../out/SHA256SUMS

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wfeature-inotia2-lab
          path: out/
          if-no-files-found: error
          retention-days: 7
