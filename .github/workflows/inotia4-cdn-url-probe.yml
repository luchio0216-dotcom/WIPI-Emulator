name: Inotia4 CDN URL probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inotia4-cdn-url-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect redirects
        shell: bash
        run: |
          set -x
          for ID in 19006 19009; do
            echo "=== $ID ==="
            curl -sSIL --max-time 30 \
              -A 'Mozilla/5.0 GitHub-Actions-Inotia4-CI' \
              -e "https://www.vkxiazai.com/game/$ID.html" \
              -w '\nFINAL=%{url_effective}\n' \
              "https://api.vkxiazai.com/down/$ID" || true
          done
